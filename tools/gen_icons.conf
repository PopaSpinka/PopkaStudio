# Ресурсы скетча → src/halo_assets.*:  $PY tools/halo_assets.py projects/HaloWatch
# Шрифт — Google Sans Flex (шрифт Pixel Watch, лицензия OFL — tools/fonts/GoogleSansFlex-OFL.txt) со скруглёнными
# концами букв (ROND=100), как на Wear OS 6. Интерфейс английский — только латиница. Значки Font Awesome — шрифтом:
# ставятся по строке, как буквы
# Весь интерфейс — одними настройками шрифта, как на погоде и циферблате: буквы — жирность 620 и ширина 104 (как город
# на погоде), числа — 660 (как числа погоды)
font  t_title GoogleSansFlex.ttf  34  latin punct "é"  @wght=620,wdth=104,ROND=100   # заголовки: «Gallery», «Settings», заглушки; город на погоде; трек в плеере
font  t24     GoogleSansFlex.ttf  24  latin punct "é"  @wght=620,wdth=104,ROND=100   # названия карточек и страниц, время сверху; исполнитель
font  t20     GoogleSansFlex.ttf  20  latin punct  @wght=620,wdth=104,ROND=100   # подписи карточек
font  n48     GoogleSansFlex.ttf  48  digits ",:°%-" @wght=660,ROND=100          # числа на страницах; процент батареи
font  ic24  fa-solid-900.ttf    24  0xf054 0xf0f3 0xf001 0xf185 0xf013 0xf042 0xf240 0xf0e7 0xf028 0xf004 0xf067 0xf068   # значки карточек и разделов настроек; батарея, молния; плеер: громкость, сердце, +, −
font  ic18  fa-solid-900.ttf    18  0xf023 0xf09c 0xf0e7                      # замок блокировки (закрыт, открыт); молния графика
font  ic32  fa-solid-900.ttf    32  0xf004 0xf624 0xf186 0xf185 0xf068 0xf067   # значки страниц; «−» и «+» ползунка
# Погода (design/weather2_mockup.webp): кегль — по высоте букв и цифр макета, жирность — по «краске», ширина букв города —
# по ширине строки; весь экран — в 1,2 раза крупнее макета (WX_SCALE в weather.h): кегли макета 28, 76, 31, 23 × 1,2
font  w_now   GoogleSansFlex.ttf  91  digits "°"      @wght=660,ROND=100            # температура сейчас
font  w_hl    GoogleSansFlex.ttf  37  digits          @wght=660,ROND=100            # максимум и минимум
font  w_hour  GoogleSansFlex.ttf  28  digits "APM"    @wght=700,ROND=100            # часы прогноза: «7AM»
image img_wx     assets/wx_big.png     # солнце за облаком (assets/gen_icons.py)
image img_wx_sm  assets/wx_small.png
image img_wsun      assets/wx_sun.png        # солнце, облачно, дождь — в том же стиле (страницы городов, циферблат)
image img_wsun_sm   assets/wx_sun_sm.png
image img_wcloud    assets/wx_cloud.png
image img_wcloud_sm assets/wx_cloud_sm.png
image img_wrain     assets/wx_rain.png
image img_wrain_sm  assets/wx_rain_sm.png
# Циферблат (design/face_mockup.webp): кегль — по высоте цифр макета, жирность — по количеству «краски»; у времени
# ещё и ширина букв (wdth=106) и разрядка −1 (face.h) — по наложению на макет: совпадение 0,56 → 0,66, ширина строки та же
# Весь циферблат — в 1,2 раза крупнее макета (FACE_SCALE в face.h): кегли макета 123, 34, 48 × 1,2
font  f_time  GoogleSansFlex.ttf  148  digits ":-"                          @wght=580,wdth=106,ROND=100   # время
font  f_date  GoogleSansFlex.ttf  41   digits "ABCDEFGHIJKLMNOPQRSTUVWXYZ, " @wght=700,ROND=100   # дата капсом
font  f_temp  GoogleSansFlex.ttf  58   digits "°-"                          @wght=700,ROND=100   # температура в плашке
image img_partly  assets/face_partly.png   # погода на циферблате: солнце за облаком (как на макете)
image img_sun     assets/face_sun.png
image img_cloud   assets/face_cloud.png
image img_rain    assets/face_rain.png

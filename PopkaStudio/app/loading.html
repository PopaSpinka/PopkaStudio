<!doctype html>
<!-- loading.html — the app's window while studio.py starts (main.js: show(log, error)); the editor's page replaces it -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PopkaStudio</title>
  <style>
    html, body { margin: 0; height: 100%; background: #131416; color: #ececee; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
    body { display: grid; place-items: center; -webkit-app-region: drag; user-select: none; }
    .box { display: flex; flex-direction: column; align-items: center; gap: 18px; width: min(640px, 90vw); }
    .face {
      width: 84px; height: 84px; border-radius: 50%; background: #000;
      box-shadow: 0 0 0 4px #2a2b30, 0 0 0 5px #44454b, 0 18px 50px rgba(0, 0, 0, 0.6);
      display: grid; place-items: center;
    }
    .ring {
      width: 58px; height: 58px; border-radius: 50%;
      background: conic-gradient(#4c8dff 0 var(--a, 30%), #1e1f22 var(--a, 30%) 100%);
      -webkit-mask: radial-gradient(circle, transparent 0 22px, #000 23px);
      animation: spin 1.4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .what { font-size: 15px; font-weight: 600; }
    .log {
      width: 100%; min-height: 0; max-height: 190px; margin: 0; overflow: hidden; color: #6c6d74;
      font: 11px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; text-align: left;
    }
    .bad .what { color: #ff6b6b; }
    .bad .ring { animation: none; --a: 100%; background: #ff6b6b; }
    .bad .log { color: #9c9da4; }
    button {
      display: none; -webkit-app-region: no-drag; padding: 6px 16px; border: 0; border-radius: 8px;
      background: #4c8dff; color: #fff; font: 600 13px -apple-system, system-ui, sans-serif; cursor: pointer;
    }
    .bad button { display: block; }
  </style>
</head>
<body>
  <div class="box" id="box">
    <div class="face"><div class="ring"></div></div>
    <div class="what" id="what">Starting PopkaStudio…</div>
    <button id="again">Try again</button>
    <pre class="log" id="log"></pre>
  </div>
  <script>
    // main.js: studio.py's last lines while it starts; error — it stopped (the log tells why)
    window.show = (lines, error) => {
      document.getElementById('log').textContent = lines.join('\n');
      document.getElementById('box').classList.toggle('bad', !!error);
      if (error) document.getElementById('what').textContent = error;
    };
    // Again: the editor's address — nothing there yet, main.js starts studio.py again
    document.getElementById('again').onclick = () => { location.href = 'http://localhost:8466/'; };
  </script>
</body>
</html>

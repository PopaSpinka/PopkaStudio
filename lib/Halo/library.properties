sentence=Своя библиотека интерфейса с нуля: драйверы экрана и тача, кадры только с изменениями, рисование, приборы
paragraph=Без LVGL, Arduino_GFX и библиотек датчиков. Драйвер CO5300 (QSPI, DMA по прерыванию, сигнал TE), драйвер тача CST9217, движок кадров на двух ядрах, рисующий и отправляющий только изменившиеся пачки строк, фигуры, текст и значки своих форматов (tools/halo_assets.py), трасса и запись кадров (docs/instruments.md). Описание — docs/halo.md.
